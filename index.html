.hd h1{font-size:clamp(22px,4.4vw,32px);margin:0;letter-spacing:.5px}
.hd h1 .tilde{color:var(--accent)}
.hd p{margin:6px 0 0;color:var(--ink2);font-size:14px}
.count{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow)}
.count b{color:var(--ink);font-size:15px}

/* SECTION: tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:14px;color:var(--ink2);
  transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--tc,#ff7a59)}
.tab .num{font-size:12px;opacity:.7}

/* SECTION: layout */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

.tagline{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;letter-spacing:.4px;

.say{font-size:clamp(26px,5.4vw,42px);line-height:1.28;font-weight:700;margin:0;word-break:break-word;
  letter-spacing:.5px}
.hint{margin:16px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.6}
.hint::before{content:"怎么用：";color:var(--ink);font-weight:600}
.pop{animation:pop .34s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;

.btn:active{transform:scale(.96)}
.btn-dice{background:var(--ink);color:#fff;flex:1 1 200px}
.btn-dice:hover{filter:brightness(1.15)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);flex:0 1 auto}
.btn-ghost:hover{border-color:var(--ink)}
.btn-ghost.on{background:#fff2d9;border-color:#f2b632;color:#8a5d00}
.kbd{margin-top:14px;font-size:12.5px;color:var(--ink2)}
.kbd kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;
  padding:2px 7px;font-family:inherit;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;

.toast.show{opacity:1;transform:translate(-50%,0)}

/* SECTION: footer */

    { c: "mood", t: "嘶——", h: "倒吸凉气，替人尴尬" },
    { c: "mood", t: "啊这", h: "接不住话的第一反应" },
    { c: "mood", t: "我趣", h: "轻度惊讶，不脏" },
    { c: "mood", t: "叮~", h: "灵光一现或阴阳怪气" },
    { c: "mood", t: "咻——", h: "跑路的拟声" },
    { c: "mood", t: "biu biu", h: "开玩笑式攻击" },
    /* 万能句式 */
    { c: "pattern", t: "X，但Y", h: "会说话，但下次别说了 / 有进步，但进步得不明显" },
    { c: "pattern", t: "主打一个X", h: "主打一个松弛 / 真实 / 佛系" },
    { c: "pattern", t: "一整个X住", h: "一整个大无语住" },
    { c: "pattern", t: "X基础，X就不基础", h: "反差夸人模板" },
    { c: "pattern", t: "预制X", h: "预制朋友圈 / 预制人生，吐槽标准化" },
    { c: "pattern", t: "这波是纯纯X", h: "这波是纯纯拿捏住我了" },
    { c: "pattern", t: "X界天花板", h: "摆烂界天花板" },
    { c: "pattern", t: "建议直接X", h: "建议直接封神，别出来卷我们" },
    { c: "pattern", t: "别问，问就是X", h: "拒绝解释时用" },
    { c: "pattern", t: "X的是吧？", h: "拆家的是吧？属哈士奇的是吧？" },
    { c: "pattern", t: "我要是你，我都X", h: "我要是你，我都佩服我自己" },
    { c: "pattern", t: "从从容容X，匆匆忙忙Y", h: "反差描述一天的状态" }
  ],
  /* SECTION: tips - 使用红线 */
  rules: [
    "只调侃行为：熬夜、迷路、吃太多、反应慢",
    "不碰真实在意的点：家人、成绩、身材焦虑、经济状况",
    "语气和表情比词汇本身更重要",
    "对方真情绪低落时，立刻关掉怼人模式"
  ]
};

</script>
<script>
/* SECTION: app */
(function(){
  var DATA = window.MEME_DATA || {categories:[],items:[],rules:[]};
  var CATS = DATA.categories, ITEMS = DATA.items, RULES = DATA.rules || [];
  var LS_KEY = "meme_favorite_v1";
  var state = { cat:"all", idx:-1, lastIdx:-1, favs:load() };

  var $ = function(id){ return document.getElementById(id); };
  var elTabs=$("tabs"), elSay=$("say"), elHint=$("hint"), elTag=$("tagline"),
      elBubble=$("bubble"), elToast=$("toast"), elFavList=$("favList"),
      elFavEmpty=$("favEmpty"), elFavMini=$("favMini"), elBtnFav=$("btnFav");

  /* SECTION: storage */
  function load(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state.favs)); }catch(e){}
  }

  /* SECTION: pool */
  function pool(cat){
    return cat === "all" ? ITEMS : ITEMS.filter(function(i){ return i.c === cat; });
  }
  function catOf(id){
    for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id) return CATS[i]; }
    return null;
  }

  /* SECTION: render tabs */
  function renderTabs(){
    var html = '<button class="tab" role="tab" data-cat="all" aria-selected="true">全部 <span class="num">'+ITEMS.length+'</span></button>';
    CATS.forEach(function(c){
      var n = pool(c.id).length;
      html += '<button class="tab" role="tab" data-cat="'+c.id+'" aria-selected="false" style="--tc:'+c.color+'">'
            + '<span class="dot"></span>'+c.name+' <span class="num">'+n+'</span></button>';
    });
    elTabs.innerHTML = html;
  }

  /* SECTION: draw */
  function draw(first){
    var list = pool(state.cat);
    if(!list.length){ toast("这一类暂时是空的"); return; }
    var idx;
    if(list.length === 1){ idx = 0; }
    else{
      do{ idx = Math.floor(Math.random()*list.length); }while(idx === state.lastIdx);
    }
    state.lastIdx = state.idx = idx;
    paint(list[idx]);
    if(!first){
      elBubble.classList.remove("pop"); void elBubble.offsetWidth; elBubble.classList.add("pop");
    }
    syncFavBtn();
  }
  function paint(item){
    var c = catOf(item.c);
    elSay.textContent = item.t;
    elHint.textContent = item.h || "顺手就能用，别想太多。";
    elTag.innerHTML = c
      ? '<span class="em">'+c.emoji+'</span>'+c.name+' · 第 '+(state.idx+1)+'/'+pool(state.cat).length+' 条'
      : '随机一句';
    elBubble.style.setProperty("--accent", c ? c.color : "#ff7a59");
  }

  /* SECTION: favorite */
  function findFav(t){
    for(var i=0;i<state.favs.length;i++){ if(state.favs[i].t===t) return i; }
    return -1;
  }
  function toggleFav(){
    var list = pool(state.cat);
    var item = state.idx>=0 ? list[state.idx] : null;
    if(!item){ toast("先抽一句再收藏"); return; }
    var at = findFav(item.t);
    if(at >= 0){ state.favs.splice(at,1); toast("已取消收藏"); }
    else{ state.favs.unshift(item); toast("收藏好了，"+item.t); }
    save(); renderFavs(); syncFavBtn();
  }
  function syncFavBtn(){
    var list = pool(state.cat);
    var item = state.idx>=0 ? list[state.idx] : null;
    var on = !!(item && findFav(item.t) >= 0);
    elBtnFav.classList.toggle("on", on);
    elBtnFav.textContent = on ? "✅ 已收藏" : "⭐ 收藏";
  }
  function renderFavs(){
    $("favCount").textContent = state.favs.length;
    $("favTip").textContent = state.favs.length ? state.favs.length+" 条" : "";
    elFavMini.hidden = state.favs.length === 0;
    elFavEmpty.hidden = state.favs.length > 0;
    elFavList.innerHTML = state.favs.map(function(f,i){
      var c = catOf(f.c);
      return '<li class="fav-item"><div class="ft">'+esc(f.t)
           + '<span class="fc">'+(c?c.name:"")+(f.h?" · "+esc(f.h):"")+'</span></div>'
           + '<button class="fx" data-i="'+i+'" aria-label="删除这条收藏">×</button></li>';
    }).join("");
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

  /* SECTION: copy */
  function copyText(txt, okMsg){
    var done = function(){ toast(okMsg); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ legacy(txt, done); });
    }else{ legacy(txt, done); }
  }
  function legacy(txt, done){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ toast("复制没成功，长按选中文字手动复制"); }
    document.body.removeChild(ta);
  }
  function copyCurrent(){
    var list = pool(state.cat);
    var item = state.idx>=0 ? list[state.idx] : null;
    if(!item){ toast("先抽一句"); return; }
    copyText(item.t, "已复制：" + item.t);
  }

  /* SECTION: toast */
  var tt;
  function toast(msg){
    elToast.textContent = msg; elToast.classList.add("show");
    clearTimeout(tt); tt = setTimeout(function(){ elToast.classList.remove("show"); }, 1900);
  }

  /* SECTION: events */
  elTabs.addEventListener("click", function(e){
    var b = e.target.closest(".tab"); if(!b) return;
    state.cat = b.dataset.cat; state.idx = -1; state.lastIdx = -1;
    Array.prototype.forEach.call(elTabs.children, function(t){
      t.setAttribute("aria-selected", String(t === b));
    });
    draw(false);
  });
  $("btnDice").addEventListener("click", function(){ draw(false); });
  $("btnCopy").addEventListener("click", copyCurrent);
  elBtnFav.addEventListener("click", toggleFav);
  elFavList.addEventListener("click", function(e){
    var b = e.target.closest(".fx"); if(!b) return;
    state.favs.splice(+b.dataset.i, 1); save(); renderFavs(); syncFavBtn(); toast("删掉了");
  });
  $("btnCopyAll").addEventListener("click", function(){
    copyText(state.favs.map(function(f){ return f.t; }).join("\n"),
             "已复制全部 "+state.favs.length+" 条");
  });
  $("btnClear").addEventListener("click", function(){
    if(!state.favs.length) return;
    state.favs = []; save(); renderFavs(); syncFavBtn(); toast("收藏清空了");
  });
  document.addEventListener("keydown", function(e){
    if(e.target.matches("input,textarea")) return;
    var k = e.key.toLowerCase();
    if(e.key === " " || k === "arrowright"){ e.preventDefault(); draw(false); }
    else if(k === "c"){ copyCurrent(); }
    else if(k === "s"){ toggleFav(); }
  });

  /* SECTION: init */
  $("totalCount").textContent = ITEMS.length;
  $("rules").innerHTML = RULES.map(function(r,i){
    return '<li><span class="ic">'+(i+1)+'</span><span>'+esc(r)+'</span></li>';
  }).join("");
  renderTabs(); renderFavs(); draw(true);
})();
</script>
</body>
</html>
